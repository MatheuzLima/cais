name: Relatar um bug
description: Algo não funciona como deveria no Cais.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por relatar! Antes, veja se já existe uma [issue parecida](https://github.com/MatheuzLima/cais/issues).

        **Falhas de segurança não devem ser relatadas aqui.** Siga o [SECURITY.md](https://github.com/MatheuzLima/cais/blob/main/SECURITY.md).

  - type: textarea
    attributes:
      label: O que aconteceu
      description: Descreva o problema e o que você esperava que acontecesse.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Vá em '...'
        2. Clique em '...'
        3. Veja o erro
    validations:
      required: true

  - type: textarea
    attributes:
      label: Logs ou prints
      description: Saída de `docker logs cais` e/ou capturas de tela. Remova senhas e tokens.
    validations:
      required: false

  - type: input
    attributes:
      label: Versão do Cais
      description: 'Aparece no rodapé do menu lateral, ou use a tag da imagem (ex.: 2.45.0-cais.1).'
    validations:
      required: true

  - type: input
    attributes:
      label: Plataforma
      description: 'Docker, Swarm ou Podman, com versão e sistema. Ex.: Docker 27.3 no Ubuntu 24.04 amd64'
    validations:
      required: true

  - type: input
    attributes:
      label: Navegador
      description: 'Ex.: Chrome 130'
    validations:
      required: false
