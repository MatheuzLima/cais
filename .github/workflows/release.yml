name: Release image

# Publishes the image to Docker Hub when a version tag is pushed:
#
#   git tag v2.45.0-cais.2 && git push origin v2.45.0-cais.2
#
# Requires the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# (a Docker Hub access token with Read & Write permission).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: docker.io/matheuslimams/cais

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # v2.45.0-cais.2 -> 2.45.0-cais.2 and latest; manual runs -> edge
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/cais/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            IMAGE_TAG=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
