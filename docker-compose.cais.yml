services:
  cais:
    # published image; `docker compose -f docker-compose.cais.yml up -d --build`
    # builds it from this checkout instead
    image: matheuslimams/cais:latest
    build:
      context: .
      dockerfile: build/cais/Dockerfile
    container_name: cais
    restart: unless-stopped
    ports:
      - '9443:9443'
      - '9000:9000'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - cais_data:/data

volumes:
  cais_data:
